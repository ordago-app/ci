---
# ── github-review: one reviewer instance on one Docker host ──
# Everything the instance needs is an image this repository published at the pinned
# commit, or a role variable. Two instances on one host are two runs of this role with different
# github_review_instance and github_review_root.
- name: This operator has said which instance, where, and with what config
  ansible.builtin.assert:
    that:
      - github_review_instance is defined
      - github_review_instance is match('^[a-z0-9][a-z0-9-]{0,39}$')
      - github_review_root is defined and github_review_root | length > 0
      - github_review_root is match('^/')
      - github_review_owner is defined and github_review_owner | length > 0
      - github_review_config is defined and github_review_config | length > 0
    fail_msg: >-
      github_review needs github_review_instance ([a-z0-9-]), github_review_root
      (an absolute path), github_review_owner and github_review_config, from the
      OPERATOR's inventory. This collection ships no instance of its own.

- name: ci_image_tag pins a commit of this repository
  ansible.builtin.assert:
    that:
      - ci_image_tag is defined
      - ci_image_tag is match('^[0-9a-f]{40}$')
    fail_msg: >-
      ci_image_tag must be the full commit SHA this collection is pinned to. A branch,
      a short SHA or `latest` would let the image move without the owner choosing it.

- name: The config names the same instance as the inventory
  ansible.builtin.assert:
    that:
      - (lookup('ansible.builtin.file', github_review_config) | from_yaml).instance == github_review_instance
    fail_msg: >-
      {{ github_review_config }} must set `instance: {{ github_review_instance }}`:
      the service labels and reaps its review containers by it, so two names for
      one instance would reap the wrong containers.

- name: The owner's uid and gid, which git in the service runs as
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_review_owner }}"

- name: Instance directories exist
  ansible.builtin.file:
    path: "{{ github_review_root }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "", owner: "{{ github_review_owner }}", mode: "0750" }
    - { path: app, owner: "{{ github_review_owner }}", mode: "0750" }
    - { path: secrets, owner: root, mode: "0700" }
  loop_control:
    label: "{{ item.path or '.' }}"

- name: State and clones dirs inside the instance root exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    # jobs.db and each codex login. The service runs as root.
    - { path: "{{ github_review_state_dir }}", owner: root, mode: "0700" }
    # Clones and review worktrees, mounted at this same path inside the service.
    - { path: "{{ github_review_projects_dir }}", owner: "{{ github_review_owner }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"
  when: item.path.startswith(github_review_root ~ '/')

- name: State and clones dirs outside the instance root are looked up
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ github_review_state_dir }}"
    - "{{ github_review_projects_dir }}"
  when: not item.startswith(github_review_root ~ '/')
  register: github_review_outside_dirs

- name: A state or clones dir outside the instance root already exists
  ansible.builtin.assert:
    that:
      - item.item is match('^/')
      - item.stat.isdir | default(false)
    fail_msg: >-
      {{ item.item }} is outside github_review_root, so the role does not create
      it or change its owner: it must be an existing absolute directory.
  loop: "{{ github_review_outside_dirs.results | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: The compose file is in place
  ansible.builtin.copy:
    src: "{{ role_path }}/../../services/github-review/compose.yml"
    dest: "{{ github_review_root }}/app/compose.yml"
    owner: "{{ github_review_owner }}"
    group: "{{ github_review_owner }}"
    mode: "0644"

- name: This instance's config is in place
  ansible.builtin.copy:
    src: "{{ github_review_config }}"
    dest: "{{ github_review_root }}/app/agent-review.yml"
    owner: "{{ github_review_owner }}"
    group: "{{ github_review_owner }}"
    mode: "0640"
  register: github_review_config_file

- name: Compose variables for this instance
  ansible.builtin.copy:
    dest: "{{ github_review_root }}/app/.env"
    owner: "{{ github_review_owner }}"
    group: "{{ github_review_owner }}"
    mode: "0640"
    content: |
      GITHUB_REVIEW_INSTANCE={{ github_review_instance }}
      GITHUB_REVIEW_PROJECTS_DIR={{ github_review_projects_dir }}
      GITHUB_REVIEW_STATE_DIR={{ github_review_state_dir }}
      GITHUB_REVIEW_SECRETS_DIR={{ github_review_root }}/secrets
      GITHUB_REVIEW_NETWORK={{ github_review_network }}
      GITHUB_REVIEW_RUN_AS_UID={{ ansible_facts.getent_passwd[github_review_owner][1] }}
      GITHUB_REVIEW_RUN_AS_GID={{ ansible_facts.getent_passwd[github_review_owner][2] }}
      GITHUB_REVIEW_IMAGE={{ ci_image_registry }}/github-review:{{ ci_image_tag }}
      CLAUDE_REVIEW_IMAGE={{ ci_image_registry }}/github-review-claude:{{ ci_image_tag }}
      CODEX_REVIEW_IMAGE={{ ci_image_registry }}/github-review-codex:{{ ci_image_tag }}

- name: Every env credential can be single-quoted in the env file
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - "\"'\" not in (item.value | string)"
      - "'\\n' not in (item.value | string)"
    fail_msg: >-
      github_review_secrets.{{ item.key }} must be a shell-style name whose value
      has no single quote and no newline: it is written single-quoted to
      secrets.env, and either would end the value early or start a new variable.
  loop: "{{ github_review_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Credentials named by env are in the service's env file
  ansible.builtin.copy:
    dest: "{{ github_review_root }}/app/secrets.env"
    owner: root
    group: root
    mode: "0600"
    content: |
      {% for name, value in github_review_secrets | dictsort %}
      {{ name }}='{{ value }}'
      {% endfor %}
  register: github_review_env_file
  no_log: true

- name: Credentials named by file are in the secrets dir
  ansible.builtin.copy:
    dest: "{{ github_review_root }}/secrets/{{ item.key }}"
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ github_review_secret_files | dict2items }}"
  register: github_review_secret_file_copies
  no_log: true

- name: Each seeded codex account has a login dir
  ansible.builtin.file:
    path: "{{ github_review_state_dir }}/codex/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ github_review_codex_seeds.keys() | list }}"

- name: A codex account with no login yet gets its seed, and a live one is left alone
  ansible.builtin.copy:
    dest: "{{ github_review_state_dir }}/codex/{{ item.key }}/auth.json"
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop: "{{ github_review_codex_seeds | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Codex login dirs outside the state dir are looked up
  ansible.builtin.stat:
    path: "{{ item.value }}"
  loop: "{{ github_review_codex_login_dirs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: github_review_codex_login_stats

- name: Each codex login dir is an existing absolute dir, for an unseeded account
  ansible.builtin.assert:
    that:
      - item.item.key is match('^[a-z0-9][a-z0-9-]{0,39}$')
      - item.item.value is match('^/')
      - item.stat.isdir | default(false)
      - item.item.key not in github_review_codex_seeds
    fail_msg: >-
      github_review_codex_login_dirs.{{ item.item.key }} must be an account name
      mapped to an existing absolute directory, and that account must have no
      github_review_codex_seeds entry: a seed would land under the mount, unseen.
      A missing dir would be created by docker, empty and root-owned.
  loop: "{{ github_review_codex_login_stats.results }}"
  loop_control:
    label: "{{ item.item.key }}"

# Compose reads compose.override.yml beside compose.yml on its own, so the mounts
# apply to `docker compose` run by hand in the app dir as well.
- name: Codex login dirs are mounted where the service looks for each account's login
  ansible.builtin.copy:
    dest: "{{ github_review_root }}/app/compose.override.yml"
    owner: "{{ github_review_owner }}"
    group: "{{ github_review_owner }}"
    mode: "0644"
    content: |
      # Rendered by roles/github_review from github_review_codex_login_dirs.
      services:
        github-review:
          volumes:
      {% for account, dir in github_review_codex_login_dirs | dictsort %}
            - "{{ dir }}:/var/lib/github-review/codex/{{ account }}:rw"
      {% endfor %}
  when: github_review_codex_login_dirs | length > 0

- name: No codex login dir, no compose override
  ansible.builtin.file:
    path: "{{ github_review_root }}/app/compose.override.yml"
    state: absent
  when: github_review_codex_login_dirs | length == 0

- name: The network /status and /heads are served on exists
  community.docker.docker_network:
    name: "{{ github_review_network }}"
    state: present

# Spawned by the service rather than run by compose, so no `up` would pull them.
# One tag per commit, so two instances pinned to different commits never share one.
- name: The review sandbox images are present
  community.docker.docker_image:
    name: "{{ ci_image_registry }}/{{ item }}:{{ ci_image_tag }}"
    source: pull
    state: present
  loop:
    - github-review-claude
    - github-review-codex

# Compose recreates the service for a changed image or env file, but not for a
# changed agent-review.yml: it is a single-file bind mount, and copy replaces the
# file rather than rewriting it, so the running container keeps reading the old
# one. A config-only deploy then reported success and changed nothing (ordago,
# 2026-11-06). Any input the service reads at start forces a recreate.
- name: github-review stack up
  community.docker.docker_compose_v2:
    project_src: "{{ github_review_root }}/app"
    state: present
    build: never
    pull: missing
    recreate: >-
      {{ 'always' if (github_review_config_file is changed
                      or github_review_env_file is changed
                      or github_review_secret_file_copies is changed) else 'auto' }}
