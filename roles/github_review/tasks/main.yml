---
# ── github-review: one reviewer instance on one Docker host ──
# Everything the instance needs is built from this collection or given as a role
# variable. Two instances on one host are two runs of this role with different
# github_review_instance and github_review_root.
- name: This operator has said which instance, where, and with what config
  ansible.builtin.assert:
    that:
      - github_review_instance is defined
      - github_review_instance is match('^[a-z0-9][a-z0-9-]{0,39}$')
      - github_review_root is defined and github_review_root | length > 0
      - github_review_root is match('^/')
      - github_review_owner is defined and github_review_owner | length > 0
      - github_review_config is defined and github_review_config | length > 0
    fail_msg: >-
      github_review needs github_review_instance ([a-z0-9-]), github_review_root
      (an absolute path), github_review_owner and github_review_config, from the
      OPERATOR's inventory. This collection ships no instance of its own.

- name: The config names the same instance as the inventory
  ansible.builtin.assert:
    that:
      - (lookup('ansible.builtin.file', github_review_config) | from_yaml).instance == github_review_instance
    fail_msg: >-
      {{ github_review_config }} must set `instance: {{ github_review_instance }}`:
      the service labels and reaps its review containers by it, so two names for
      one instance would reap the wrong containers.

- name: The owner's uid and gid, which git in the service runs as
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_review_owner }}"

- name: Instance directories exist
  ansible.builtin.file:
    path: "{{ github_review_root }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "", owner: "{{ github_review_owner }}", mode: "0750" }
    - { path: app, owner: "{{ github_review_owner }}", mode: "0750" }
    # jobs.db and each codex login. The service runs as root.
    - { path: state, owner: root, mode: "0700" }
    # Clones and review worktrees, mounted at this same path inside the service.
    - { path: projects, owner: "{{ github_review_owner }}", mode: "0750" }
    - { path: secrets, owner: root, mode: "0700" }
  loop_control:
    label: "{{ item.path or '.' }}"

# Content comparison + skip mtime-only updates: see ci_lane_host role for details.
- name: github-review build context (service, sandbox images, compose file)
  ansible.posix.synchronize:
    src: "{{ role_path }}/../../services/github-review/"
    dest: "{{ github_review_root }}/app/"
    rsync_opts:
      - "--exclude=tests"
      - "--exclude=__pycache__"
      - "--exclude=.venv"
      - "--exclude=.pytest_cache"
      - "--checksum"
      - "--no-times"
  become: true
  become_user: "{{ github_review_owner }}"

- name: This instance's config is in place
  ansible.builtin.copy:
    src: "{{ github_review_config }}"
    dest: "{{ github_review_root }}/app/agent-review.yml"
    owner: "{{ github_review_owner }}"
    group: "{{ github_review_owner }}"
    mode: "0640"

- name: Compose variables for this instance
  ansible.builtin.copy:
    dest: "{{ github_review_root }}/app/.env"
    owner: "{{ github_review_owner }}"
    group: "{{ github_review_owner }}"
    mode: "0640"
    content: |
      GITHUB_REVIEW_INSTANCE={{ github_review_instance }}
      GITHUB_REVIEW_PROJECTS_DIR={{ github_review_root }}/projects
      GITHUB_REVIEW_STATE_DIR={{ github_review_root }}/state
      GITHUB_REVIEW_SECRETS_DIR={{ github_review_root }}/secrets
      GITHUB_REVIEW_NETWORK={{ github_review_network }}
      GITHUB_REVIEW_RUN_AS_UID={{ ansible_facts.getent_passwd[github_review_owner][1] }}
      GITHUB_REVIEW_RUN_AS_GID={{ ansible_facts.getent_passwd[github_review_owner][2] }}

- name: Every env credential can be single-quoted in the env file
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - "\"'\" not in (item.value | string)"
      - "'\\n' not in (item.value | string)"
    fail_msg: >-
      github_review_secrets.{{ item.key }} must be a shell-style name whose value
      has no single quote and no newline: it is written single-quoted to
      secrets.env, and either would end the value early or start a new variable.
  loop: "{{ github_review_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Credentials named by env are in the service's env file
  ansible.builtin.copy:
    dest: "{{ github_review_root }}/app/secrets.env"
    owner: root
    group: root
    mode: "0600"
    content: |
      {% for name, value in github_review_secrets | dictsort %}
      {{ name }}='{{ value }}'
      {% endfor %}
  no_log: true

- name: Credentials named by file are in the secrets dir
  ansible.builtin.copy:
    dest: "{{ github_review_root }}/secrets/{{ item.key }}"
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ github_review_secret_files | dict2items }}"
  no_log: true

- name: Each seeded codex account has a login dir
  ansible.builtin.file:
    path: "{{ github_review_root }}/state/codex/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ github_review_codex_seeds.keys() | list }}"

- name: A codex account with no login yet gets its seed, and a live one is left alone
  ansible.builtin.copy:
    dest: "{{ github_review_root }}/state/codex/{{ item.key }}/auth.json"
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop: "{{ github_review_codex_seeds | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: The network /status and /heads are served on exists
  community.docker.docker_network:
    name: "{{ github_review_network }}"
    state: present

# Spawned by the service rather than run by compose, so no `up` would build them.
# force_source so a bumped CLI pin rebuilds; an unchanged Dockerfile is a cache
# hit. Tagged per instance: two instances pinned to different SHAs of this repo
# must not overwrite each other's sandbox.
- name: The review sandbox images are built
  community.docker.docker_image:
    name: "ordago-ci/{{ item }}"
    tag: "{{ github_review_instance }}"
    source: build
    force_source: true
    state: present
    build:
      path: "{{ github_review_root }}/app/{{ item }}"
      pull: false
  loop:
    - claude-review
    - codex-review

- name: github-review stack up
  community.docker.docker_compose_v2:
    project_src: "{{ github_review_root }}/app"
    state: present
    build: always
