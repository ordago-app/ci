---
# ── github-review (agentic PR reviews; reuses claude-router + codex images) ──
- name: Preconditions for a dispatcher host are met
  ansible.builtin.assert:
    that:
      - services_root is defined and services_root | length > 0
      - personal_root is defined and personal_root | length > 0
      - operator_user is defined and operator_user | length > 0
    fail_msg: >-
      github_review requires services_root, personal_root and operator_user, which
      come from the OPERATOR's inventory, not from this collection.

# DELIBERATELY no secrets-file assert here, unlike ci_controller. Ruling 7:
# services/github-review/compose.yml declares no `env_file:` at all — only
# three plain, non-secret environment variables (AGENT_REVIEW_CONFIG,
# STATE_DIR, PROJECTS_ROOT) — and the service's own src/main.py reads no
# token/secret env var either. It authenticates to GitHub only indirectly, by
# calling claude-router over ROUTER_INTERNAL_URL; claude-router's own stack
# (not part of this ported range) holds the GitHub App credentials. This
# stack holds no credential to leak, so it takes no secrets directory and
# asserts on no secret file. Do not restore a stat-loop assert here without
# first re-checking services/github-review/compose.yml for a new env_file.

- name: github-review service dir
  ansible.builtin.file:
    path: "{{ services_root }}/github-review"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"

- name: github-review state dir exists
  ansible.builtin.file:
    path: "{{ personal_root }}/state/github-review"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0750"

- name: place agent-review.yml on host
  ansible.builtin.copy:
    src: "{{ role_path }}/../../personal/agent-review.yml"
    dest: "{{ personal_root }}/agent-review.yml"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0640"

- name: github-review compose file
  ansible.builtin.copy:
    src: "{{ role_path }}/../../services/github-review/compose.yml"
    dest: "{{ services_root }}/github-review/compose.yml"
    mode: "0644"

- name: github-review build context (Dockerfile + src/ + pyproject.toml + uv.lock)
  ansible.posix.synchronize:
    src: "{{ role_path }}/../../services/github-review/"
    dest: "{{ services_root }}/github-review/"
    rsync_opts:
      - "--exclude=tests"
      - "--exclude=__pycache__"
      - "--exclude=.venv"
  become: true
  become_user: "{{ operator_user }}"

- name: github-review stack up
  community.docker.docker_compose_v2:
    project_src: "{{ services_root }}/github-review"
    state: present
    build: always
