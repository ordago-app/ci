---
# Required, deliberately without defaults (the role asserts each):
#   github_review_instance  — this instance's name: [a-z0-9-], unique per Docker
#                             host. Names its compose project, container, images
#                             and review containers. Must equal `instance:` in
#                             the config.
#   github_review_root      — the directory on the host that holds everything
#                             this instance owns (build context, config, secrets,
#                             state, clones). One per instance.
#   github_review_owner     — the host user that owns it. Git in the service runs
#                             as this user's uid, so the clones stay theirs.
#   github_review_config    — path, on the Ansible controller, to this instance's
#                             agent-review.yml (schema: README.md).
#   ci_image_tag            — the full commit SHA this collection is pinned to. The
#                             instance runs the images published at that commit.
# A default for any of these would be one operator's machine wearing a neutral
# name, inherited by every other operator without their noticing.

# The Docker network /status and /heads are served on: whatever reads them (a
# dashboard, ci-controller) joins it. Created if absent. Review containers never
# join it.
github_review_network: "github-review-{{ github_review_instance }}"

# Where jobs.db and the codex logins live (mounted at /var/lib/github-review), and
# where the clones are (mounted at this same path). Inside github_review_root, as by
# default, the role creates each and sets its owner and mode. A path outside it is
# one something else uses too, such as a reviewer's existing state or clones shared
# with other agents, so the role only checks that it exists and never changes its
# owner or mode.
github_review_state_dir: "{{ github_review_root }}/state"
github_review_projects_dir: "{{ github_review_root }}/projects"

# Codex logins kept outside the state dir, as {account: host dir holding its
# auth.json}. Each dir is mounted read-write at /var/lib/github-review/codex/<account>,
# where the README tells the account's `credential.file` to point, and keeps its
# owner and mode. For a login other processes on the host also read: the service
# stays its only refresher (README). An account here takes no seed.
github_review_codex_login_dirs: {}

# Credentials the config names by `env:`, as {VARIABLE: value}. Rendered into a
# 0600 file the service loads; pass them from your own secret store, never
# inline. Names only are in README.md.
github_review_secrets: {}

# Credentials the config names by `file:`, as {filename: content}. Placed 0600 in
# {{ github_review_root }}/secrets, which the service sees read-only at
# /run/secrets/github-review/<filename>. A codex login does NOT go here: the
# service rewrites it, so it lives in the state dir (README.md).
github_review_secret_files: {}

# First codex logins, as {account: auth.json content}. Each is written to the
# state dir ONLY when that account has no login there yet: the service refreshes
# it in place and its refresh token is single-use, so overwriting a live login
# with this (by then spent) copy would log the account out.
github_review_codex_seeds: {}

# Where this repository's images are published (.github/workflows/images.yml).
ci_image_registry: ghcr.io/ordago-app
