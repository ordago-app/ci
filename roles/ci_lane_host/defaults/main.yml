---
# Work-dir base for lanes on this host. MUST match both `work_dirs` keys of this
# host's entry in the operator's pool config — the dispatcher passes the path
# straight to a docker bind mount, so a mismatch surfaces as a lane that cannot
# write its workspace. The check that pins these together lives in the CONSUMER,
# because only there are both facts visible. See the design section above.
ci_lane_work_dir: /opt/ci-controller/work
# pnpm's content-addressed store, bound into every lane at /cache/pnpm. Must match
# this host's `shared_mounts`. Deliberately under /opt, on the same filesystem as
# /var/lib/docker/volumes, so the store and the lane's work volume share st_dev and
# pnpm hardlinks into node_modules instead of copying.
ci_lane_pnpm_store: /opt/ci-controller/caches/pnpm-store
# The commit of this repository whose published images this host runs. NO DEFAULT:
# it is the consumer's pin, and must equal the SHA its requirements.yml pins this
# collection to, so the role and the images it runs come from one commit.
# ci_image_tag: <40-hex commit SHA>
#
# Where the images are published (.github/workflows/images.yml).
ci_image_registry: ghcr.io/ordago-app
#
# Whether this host runs the runner image WITH the Android SDK. A variable for the
# same reason the work-dir paths above are: the check that matters -- "this host's
# allowed_classes never needs a tool its image lacks" -- can only run in the
# CONSUMER, where the pool config is visible. Without the SDK the image is ~10 GB
# smaller and published as ci-runner:<sha>-light.
ci_lane_runner_with_android: false
#
# The image every lane on this host runs, derived from the three above. A consumer
# compares its pool config's runner_image for this host against this value rather
# than restating the rule.
ci_lane_runner_image: >-
  {{ ci_image_registry }}/ci-runner:{{ ci_image_tag }}{{ '' if ci_lane_runner_with_android else '-light' }}
