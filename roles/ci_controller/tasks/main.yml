---
# ── ci_controller (dynamic ephemeral runner controller + scoped socket proxy) ──
- name: Preconditions for a dispatcher host are met
  ansible.builtin.assert:
    that:
      - services_root is defined and services_root | length > 0
      - personal_root is defined and personal_root | length > 0
      - operator_user is defined and operator_user | length > 0
    fail_msg: >-
      ci_controller requires services_root, personal_root and operator_user, which
      come from the OPERATOR's inventory, not from this collection.

- name: This operator has pointed ci_controller at their own pool config
  ansible.builtin.assert:
    that:
      - ci_controller_pool_config is defined and ci_controller_pool_config | length > 0
      - ci_controller_repos_config is defined and ci_controller_repos_config | length > 0
      - ci_controller_work_dirs is defined and ci_controller_work_dirs | length > 0
      - ci_controller_cache_root is defined and ci_controller_cache_root | length > 0
    fail_msg: >-
      ci_controller_pool_config and ci_controller_repos_config must point at this
      operator's own ci-controller.yml and repos.yml, and ci_controller_work_dirs /
      ci_controller_cache_root at this machine's own disk layout. This collection
      deliberately ships neither one operator's pool config nor one operator's mount
      points — set all four in your own inventory.

- name: ci_image_tag pins a commit of this repository
  ansible.builtin.assert:
    that:
      - ci_image_tag is defined
      - ci_image_tag is match('^[0-9a-f]{40}$')
    fail_msg: >-
      ci_image_tag must be the full commit SHA this collection is pinned to. A branch,
      a short SHA or `latest` would let the image move without the owner choosing it.

# The dispatcher spawns lanes from whatever runner_image the pool config names. One
# naming another commit's image would run a runner this pin never chose, so every
# runner_image must be this commit's, full or -light. Read on the controller node:
# the pool config is the consumer's file, not the host's.
- name: Every runner_image in the pool config is this commit's
  vars:
    _pool: "{{ lookup('ansible.builtin.file', ci_controller_pool_config) | from_yaml }}"
    _runner: "{{ ci_image_registry }}/ci-runner:{{ ci_image_tag }}"
    _named: >-
      {{ [_pool.runner_image]
         + ((_pool.hosts | default({})).values() | selectattr('runner_image', 'defined')
            | map(attribute='runner_image') | list) }}
  ansible.builtin.assert:
    that:
      - item in [_runner, _runner ~ '-light']
    fail_msg: >-
      runner_image {{ item }} in {{ ci_controller_pool_config }} is not this commit's
      runner ({{ _runner }} or {{ _runner }}-light).
  loop: "{{ _named }}"

- name: repos.yml is already in place for this stack to mount
  # repos.yml is placed OUTSIDE the ported range in the source playbook (a
  # generic loop that renders every operator's repo map, not part of this
  # extraction) — this role correctly does not place it either. But
  # compose.yml mounts it read-only, and an absent bind-mount source makes
  # Docker fabricate a root-owned directory at that path instead of failing:
  # the container then dies obscurely inside ControllerConfig.load. Fail
  # loudly here instead.
  ansible.builtin.stat:
    path: "{{ ci_controller_repos_config }}"
  register: _ci_controller_repos_config

- name: This operator's repos.yml exists at ci_controller_repos_config
  ansible.builtin.assert:
    that:
      - _ci_controller_repos_config.stat.exists
      - not _ci_controller_repos_config.stat.isdir
    fail_msg: >-
      ci_controller_repos_config ({{ ci_controller_repos_config }}) must already
      exist as a file on this host before this role runs — this collection does
      not place it (it is out of the ported range). See compose.yml's
      /opt/personal/repos.yml mount.

- name: The secrets this stack needs have already been rendered
  # This role receives no secret VALUES, only the directory they were rendered
  # into. The operator renders them from their own store before invoking this
  # role — exactly as services.yml does today, in a generic loop that is not part
  # of the ported range. Taking a path instead of a value is the strongest form of
  # design decision 5: the role cannot leak, log or assume anything about a
  # credential it never receives.
  ansible.builtin.stat:
    path: "{{ ci_controller_secrets_dir }}/{{ item }}"
  register: _secret_files
  failed_when: not _secret_files.stat.exists
  loop:
    - ci-fabric.env
  loop_control:
    label: "{{ item }}"

- name: ci-controller service dir
  ansible.builtin.file:
    path: "{{ services_root }}/ci-controller"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"

- name: ci-controller metrics state dir
  ansible.builtin.file:
    path: "{{ personal_root }}/state/ci-controller"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"

- name: ci-controller lane work dirs + shared cache dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0755"
  loop: >-
    {{ ci_controller_work_dirs
       + [ci_controller_cache_root ~ '/pnpm-store',
          ci_controller_cache_root ~ '/gradle',
          ci_controller_cache_root ~ '/android-sdk'] }}

- name: place ci-controller.yml on host
  ansible.builtin.copy:
    src: "{{ ci_controller_pool_config }}"
    dest: "{{ personal_root }}/ci-controller.yml"
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0640"
  # Both processes read this file once, at startup, from a read-only bind mount, and
  # `state: present` does not recreate a container for a changed mounted file.
  notify: restart ci-controller

- name: ci-controller compose file
  ansible.builtin.copy:
    src: "{{ role_path }}/../../services/ci-controller/compose.yml"
    dest: "{{ services_root }}/ci-controller/compose.yml"
    mode: "0644"

# compose.yml names its image through this variable, so the stack runs the image
# published at the pinned commit and nothing is built on the host.
- name: ci-controller image pinned for compose
  ansible.builtin.copy:
    dest: "{{ services_root }}/ci-controller/.env"
    content: |
      CI_CONTROLLER_IMAGE={{ ci_image_registry }}/ci-controller:{{ ci_image_tag }}
    owner: "{{ operator_user }}"
    group: "{{ operator_user }}"
    mode: "0644"

- name: ci-controller stack up
  community.docker.docker_compose_v2:
    project_src: "{{ services_root }}/ci-controller"
    state: present
    build: never
    pull: missing

# A healthcheck alone is a control that cannot fire: compose marks a container
# unhealthy and does nothing about it. ci-controller shares ci-fabric's network
# namespace, and docker does not restart a dependent when the namespace owner
# restarts -- so a sidecar bounce strands the dispatcher with no DNS, Up and silent,
# until a human notices. Seen twice on the reference deployment, both at boot: the
# sidecar finished 39 s late on 2026-08-28 and 33 s late on 2026-08-30, the second
# costing an hour of unnoticed CI downtime. Both were fixed by hand with the same
# `docker restart ci-controller` this performs.
#
# A script rather than an inline ExecStart: systemd expands $VAR there, so the
# command substitution and the anchored name filter below would need escaping, on a
# single 280-character line.
- name: ci-controller healthcheck watcher script
  ansible.builtin.copy:
    dest: /usr/local/sbin/ci-controller-healthcheck-watch
    mode: "0755"
    content: |
      #!/bin/sh
      # Restart ci-controller when docker reports it unhealthy. See this role's tasks.
      set -eu

      # Filtering on HEALTH is the whole point: in the failure this exists for the
      # container stays `running`, so any liveness-based filter matches nothing.
      # The name filter is a regex -- anchored so ci-controller-socket-proxy, which
      # merely starts with the same string, can never match.
      unhealthy=$(/usr/bin/docker ps \
        --filter 'name=^/ci-controller$' \
        --filter health=unhealthy \
        --quiet)
      [ -n "$unhealthy" ] || exit 0

      # Say so. The entire cost of this failure was that nothing reported it, and a
      # silent auto-restart would hide a recurring fault just as effectively.
      echo "ci-controller unhealthy - restarting (orphaned network namespace after a ci-fabric restart?)"
      /usr/bin/docker restart ci-controller
  become: true

- name: ci-controller healthcheck watcher service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-controller-healthcheck.service
    mode: "0644"
    content: |
      [Unit]
      Description=Restart ci-controller when its healthcheck reports unhealthy
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/ci-controller-healthcheck-watch
  become: true

- name: ci-controller healthcheck watcher timer unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-controller-healthcheck.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Periodically restart an unhealthy ci-controller

      [Timer]
      # This failure happens AT BOOT, so arm shortly after one -- but late enough
      # that the compose stack has had a chance to come up on its own.
      OnBootSec=3min
      OnUnitActiveSec=1min

      [Install]
      WantedBy=timers.target
  become: true

- name: ci-controller healthcheck watcher timer enabled
  ansible.builtin.systemd:
    name: ci-controller-healthcheck.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true

# Backstop for the in-controller reap cleanup: the controller deletes a lane's
# work dir when it reaps the lane, but a lane that dies while the controller is
# down (or pre-existing cruft) is never reaped, so its dir leaks. This daily
# timer prunes any *-work dir under the work_dirs bases untouched for >1 day.
# Paths mirror work_dirs.{ssd,hdd} in personal/ci-controller.yml.
- name: ci-controller work-dir prune service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-controller-prune-workdirs.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prune stale ci-controller lane work dirs (reap-cleanup backstop)

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/find {{ ci_controller_work_dirs | join(' ') }} -mindepth 1 -maxdepth 1 -type d -name '*-work' -mtime +1 -exec rm -rf {} +
  become: true

- name: ci-controller work-dir prune timer unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-controller-prune-workdirs.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Daily prune of stale ci-controller lane work dirs

      [Timer]
      OnCalendar=daily
      Persistent=true

      [Install]
      WantedBy=timers.target
  become: true

- name: ci-controller work-dir prune timer enabled
  ansible.builtin.systemd:
    name: ci-controller-prune-workdirs.timer
    daemon_reload: true
    enabled: true
    state: started
  become: true

# The controller spawns its local lanes from the pool config's runner_image, and the
# socket proxy cannot pull, so the image must already be here. Checked above to be
# this commit's.
- name: The local lane runner image is present
  vars:
    _pool: "{{ lookup('ansible.builtin.file', ci_controller_pool_config) | from_yaml }}"
  community.docker.docker_image:
    name: "{{ _pool.runner_image }}"
    source: pull
    state: present
