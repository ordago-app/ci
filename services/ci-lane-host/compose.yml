# ci-lane-host — everything an opportunistic CI lane host runs.
#
# A lane host is NOT a second controller. It holds no secrets, no GitHub App key,
# and no metrics DB; it never learns it is part of a CI system. It runs docker,
# sshd, and this one scoped socket-proxy, through which powerserver's single
# ci-controller creates and reaps lane containers. See ADR 0016.
#
# The capability set below is powerserver's proxy config copied UNCHANGED
# (services/ci-controller/compose.yml) — same allow-list, same explicit denials.
# A wiring test asserts the two match, so a capability granted here without being
# granted there fails CI.
---
services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    container_name: ci-lane-socket-proxy
    restart: unless-stopped
    environment:
      # Allow only what the controller needs to create/start/list/remove lanes.
      CONTAINERS: 1
      POST: 1
      # Everything else denied (default 0, pinned explicitly for the wiring test).
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      SERVICES: 0
      NODES: 0
      TASKS: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      DISTRIBUTION: 0
      PLUGINS: 0
      SYSTEM: 0
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The one difference from powerserver's proxy: powerserver reaches its own
    # proxy over the internal `homelab` docker network and publishes nothing.
    # This one has to be reachable from another machine, so it publishes 2375.
    #
    # The bind address is NOT optional and NOT "0.0.0.0". This port is an
    # UNAUTHENTICATED container-create API: anyone who can reach it can start a
    # container that bind-mounts / and thereby owns the machine. Binding it to
    # the host's tailnet address means the only paths to it are inside the
    # tailnet, where a Tailscale ACL further restricts port 2375 to powerserver.
    # CI_LANE_BIND_ADDR is rendered into .env by ansible/playbooks/ci-lane-host.yml
    # from `tailscale ip -4`; compose fails to start if it is unset, which is the
    # intended behaviour — no bind address means no listener, not a wide-open one.
    ports:
      - "${CI_LANE_BIND_ADDR:?tailnet bind address required}:2375:2375"
    networks:
      - homelab

networks:
  homelab:
    external: true
    name: homelab
