# ci-lane-host — everything an opportunistic CI lane host runs.
#
# A lane host is NOT a second controller. It holds no secrets, no GitHub App key,
# and no metrics DB; it never learns it is part of a CI system. It runs docker,
# sshd, and this one scoped socket-proxy, through which powerserver's single
# ci-controller creates and reaps lane containers. See ADR 0016.
#
# The capability set below is powerserver's proxy config copied UNCHANGED
# (services/ci-controller/compose.yml) — same allow-list, same explicit denials.
# A wiring test asserts the two match, so a capability granted here without being
# granted there fails CI.
---
services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    container_name: ci-lane-socket-proxy
    restart: unless-stopped
    environment:
      # Allow only what the controller needs to create/start/list/remove lanes.
      CONTAINERS: 1
      POST: 1
      # Everything else denied (default 0, pinned explicitly for the wiring test).
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      SERVICES: 0
      NODES: 0
      TASKS: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      DISTRIBUTION: 0
      PLUGINS: 0
      SYSTEM: 0
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No published port and no docker network: this proxy shares the fabric
    # sidecar's network namespace, so 2375 listens on the fabric interface and
    # NOWHERE else. It is not bound on the host at all.
    #
    # This replaces CI_LANE_BIND_ADDR, which published 2375 on the host's personal
    # tailnet address. That worked, but its failure mode was 0.0.0.0 -- an
    # unauthenticated container-create API on every network the host can see -- and
    # it needed an ansible lookup, a guard and a rendered .env to stay safe. Not
    # binding it at all is a smaller thing to get right.
    #
    # Reachability is now decided by the fabric's ACL (tailscale/acl.hujson), which
    # is generated from the same allowed_orgs the scheduler filters placement on.
    network_mode: "service:ci-fabric"
    depends_on:
      - ci-fabric

  # Userspace tailscaled on the CI FABRIC -- a different tailnet from the one the
  # host-level tailscaled joined, which is untouched. TS_USERSPACE avoids needing
  # NET_ADMIN or a tun device.
  #
  # Deliberately NO TS_AUTHKEY and no env_file: a lane host holds no secrets
  # (ADR 0016/0017), and a key in compose would persist in `docker inspect` on the
  # guest. The join happens once via `make ci-fabric-join`, run from the operator's
  # workstation, which reads the key from the gitignored secrets/secrets.vm.yml and
  # hands it to `tailscale up` on the guest. Only tailscaled state lands on disk.
  ci-fabric:
    image: tailscale/tailscale:v1.102.2
    container_name: ci-fabric
    restart: unless-stopped
    environment:
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      # Without this the node registers under the CONTAINER ID, and
      # personal/ci-controller.yml's docker_endpoint -- which names the host --
      # resolves to nothing. The join deliberately sets no prefs (see
      # scripts/ci_fabric_join.sh), so the hostname has to come from here.
      #
      # Rendered into .env by ansible from inventory_hostname. Yes, this file just
      # deleted a .env: that one carried CI_LANE_BIND_ADDR, whose failure mode was
      # publishing an unauthenticated API on 0.0.0.0. A hostname is not a secret
      # and its failure mode is a container that will not start.
      TS_HOSTNAME: "${CI_LANE_HOSTNAME:?lane host name required}"
    volumes:
      # Named volume, not a bind: the state is the node identity. Losing it drops
      # this host out of the fabric until someone re-runs the join.
      - ci-fabric-state:/var/lib/tailscale

volumes:
  # Explicit `name:` so compose does NOT prefix it with the project directory
  # name. `make ci-fabric-join` writes the node identity into this volume by its
  # bare name before the stack exists, and compose would otherwise mount
  # `<project>_ci-fabric-state` instead -- leaving the sidecar unauthenticated and
  # printing an interactive login URL nobody reads. Hit exactly that on
  # 2026-08-25 while deploying powervaro-ci.
  ci-fabric-state:
    name: ci-fabric-state
