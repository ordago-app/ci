[project]
name = "homelab-github-review"
version = "0.1.0"
description = "Polls selected GitHub repositories and runs Codex reviewer jobs for new PR head SHAs"
requires-python = ">=3.12"
dependencies = [
  "docker>=7.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "tenacity>=8.2",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
testpaths = ["tests"]
