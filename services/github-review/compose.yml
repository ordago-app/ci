# One reviewer instance. Everything that differs between instances and hosts
# comes from the `.env` beside this file, which roles/github_review renders; a
# variable left unset stops `docker compose` with its name rather than starting
# a reviewer pointed at somebody else's paths. Two instances on one host are
# two directories, two `.env` files and two compose projects.
name: github-review-${GITHUB_REVIEW_INSTANCE:?}

services:
  github-review:
    image: ordago-ci/github-review:${GITHUB_REVIEW_INSTANCE:?}
    build: .
    container_name: github-review-${GITHUB_REVIEW_INSTANCE:?}
    restart: unless-stopped
    # Run tini as PID 1 so exited children are reaped. The worker shells out to
    # git, whose transient helper processes get reparented to PID 1; without an
    # init they linger as zombies.
    init: true
    environment:
      - AGENT_REVIEW_CONFIG=/etc/github-review/agent-review.yml
      - STATE_DIR=/var/lib/github-review
      # The same path inside as on the host: review containers are started on
      # the host's Docker daemon, which resolves their mounts by HOST path, and
      # a worktree's .git names its clone by the path it was created at.
      - PROJECTS_ROOT=${GITHUB_REVIEW_PROJECTS_DIR:?}
      - WORKTREE_RUN_AS_UID=${GITHUB_REVIEW_RUN_AS_UID:?}
      - WORKTREE_RUN_AS_GID=${GITHUB_REVIEW_RUN_AS_GID:?}
      - CLAUDE_REVIEW_IMAGE=ordago-ci/claude-review:${GITHUB_REVIEW_INSTANCE:?}
      - CODEX_REVIEW_IMAGE=ordago-ci/codex-review:${GITHUB_REVIEW_INSTANCE:?}
    # The credentials the config names by `env:`. A file, not inline here: this
    # compose file is world-readable on the host, the secrets file is 0600.
    env_file:
      - path: secrets.env
        required: true
    volumes:
      # Starts each review's sandbox container. This is why a target must be a
      # Docker host, not a serverless runtime.
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${GITHUB_REVIEW_PROJECTS_DIR:?}:${GITHUB_REVIEW_PROJECTS_DIR:?}:rw
      # jobs.db, and each codex account's login, which the service refreshes.
      - ${GITHUB_REVIEW_STATE_DIR:?}:/var/lib/github-review:rw
      # Credentials the config names by `file:`.
      - ${GITHUB_REVIEW_SECRETS_DIR:?}:/run/secrets/github-review:ro
      - ./agent-review.yml:/etc/github-review/agent-review.yml:ro
    expose:
      - "8000"
    networks:
      - reviewer

networks:
  # Where whatever reads /status and /heads (a dashboard, ci-controller) reaches
  # this service. Review containers are never on it: they get the default bridge.
  reviewer:
    external: true
    name: ${GITHUB_REVIEW_NETWORK:?}
