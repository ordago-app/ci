services:
  github-review:
    image: homelab/github-review:latest
    build: .
    container_name: github-review
    restart: unless-stopped
    # Run tini as PID 1 so exited children are reaped. The worker shells out to
    # git, whose transient helper processes get reparented to PID 1; without an
    # init they linger as zombies.
    init: true
    environment:
      - AGENT_REVIEW_CONFIG=/etc/github-review/agent-review.yml
      - STATE_DIR=/var/lib/github-review
      - PROJECTS_ROOT=/opt/personal/projects
      - ROUTER_INTERNAL_URL=http://claude-router:8000
      - AGENT_ROLE=reviewer
      - CODEX_STATE_ROOT=/opt/personal/codex-code-state
      - REVIEWER_BOT_LOGIN=homelab-claude-reviewer[bot]
      - POLL_INTERVAL_SECONDS=60
      - MAX_REVIEW_ATTEMPTS=3
      # A failed review waits this long before its next attempt, independent of
      # the 60 s poll, so an outage does not spend every attempt in minutes.
      - RETRY_BACKOFF_SECONDS=900
      # A review interrupted by a restart gets its attempt back this many times;
      # after that the interruption counts, so a review that crashes or hangs
      # the service cannot retry forever.
      - MAX_RESTART_REFUNDS=2
      # A job `running` this long with no runner thread holding it is treated as
      # interrupted. Must exceed max_runtime_minutes x the longest provider chain
      # (30 min x 4 today); the service refuses to start otherwise.
      - STUCK_RUNNING_SECONDS=10800
      - MAX_REVIEW_ROUNDS=5
      - MAX_REVIEW_RUNS=10
      # Reviews in flight at once, on any provider account, oldest PR first.
      # Each is its own agent container (~600 MB); one PR runs one at a time.
      - REVIEW_CONCURRENCY=3
    # The Claude credentials (two OAuth tokens, one API key) + the review model. Kept
    # in a secrets file rather than inline here, the way claude-router's is:
    # this compose file is world-readable on the host.
    env_file:
      - path: /opt/personal/secrets/github-review.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /opt/personal/projects:/opt/personal/projects:rw
      # rw so github-review can refresh the Codex login. Its review sessions
      # never can: each gets a read-only copy without the refresh token.
      - /opt/personal/codex-code-state:/opt/personal/codex-code-state:rw
      - /opt/personal/state/github-review:/var/lib/github-review:rw
      - /opt/personal/agent-review.yml:/etc/github-review/agent-review.yml:ro
      # Resolved from beside agent-review.yml; see ReviewConfig.load.
      - /opt/personal/repos.yml:/etc/github-review/repos.yml:ro
    expose:
      - "8000"
    networks:
      - homelab

networks:
  homelab:
    external: true
    name: homelab
