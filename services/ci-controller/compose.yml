services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    container_name: ci-controller-socket-proxy
    restart: unless-stopped
    environment:
      # Allow only what the controller needs to create/start/list/remove lanes.
      CONTAINERS: 1
      POST: 1
      # Everything else denied (default 0, pinned explicitly for the wiring test).
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      SERVICES: 0
      NODES: 0
      TASKS: 0
      INFO: 0
      AUTH: 0
      BUILD: 0
      DISTRIBUTION: 0
      PLUGINS: 0
      SYSTEM: 0
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab

  ci-controller:
    image: homelab/ci-controller:latest
    build: .
    container_name: ci-controller
    restart: unless-stopped
    init: true
    depends_on:
      - docker-socket-proxy
      - ci-scheduler
    environment:
      CI_CONTROLLER_CONFIG: /etc/ci-controller/ci-controller.yml
      CI_SCHEDULER_URL: http://ci-scheduler:8001
      # 5s (was 15s): light jobs run ~20-40s, so a 15s reconcile left finished lanes
      # unreaped for up to 15s — stale reservations consumed the lane budget and real
      # container occupancy sat at ~3-4 despite a higher ceiling. 5s reaps + refills
      # ~3x faster. Not lower: per-repo job polling at 1s would exceed the GitHub App's
      # 5000/hr rate limit (2 repos x 1s ~= 7200/hr); 5s is ~1440/hr, safe.
      POLL_INTERVAL_SECONDS: 5
      RUNNER_HOST: powerserver
      DOCKER_PROXY_URL: tcp://docker-socket-proxy:2375
      CI_CONTROLLER_DB: /var/lib/ci-controller/metrics.db
    env_file:
      - path: /opt/personal/secrets/github-actions-runner.env
        required: false
    volumes:
      - /opt/personal/ci-controller.yml:/etc/ci-controller/ci-controller.yml:ro
      # Resolved from beside ci-controller.yml; see ControllerConfig.load.
      - /opt/personal/repos.yml:/etc/ci-controller/repos.yml:ro
      - /opt/personal/state/ci-controller:/var/lib/ci-controller:rw
      # Lane work-dir bases (work_dirs.{ssd,hdd} in ci-controller.yml), mounted at
      # their host paths so the controller can delete each lane's <lane_id>-work dir
      # when it reaps the lane — otherwise ephemeral runners leak one dir per job and
      # fill the disk. Keep these paths in sync with work_dirs in ci-controller.yml.
      - /mnt/ci-ssd/ci-controller:/mnt/ci-ssd/ci-controller:rw
      - /opt/personal/github-actions/ci-controller:/opt/personal/github-actions/ci-controller:rw
    # No `expose:` here. Docker rejects it outright when network_mode is a
    # container namespace -- "conflicting options: port exposing and the container
    # type network mode" -- and the container fails to create. It was only metadata
    # anyway: docker needs no expose for container-to-container traffic, and the
    # port is reached through the sidecar's namespace and its `ci-controller` alias.
    #
    # No network of its own: it shares ci-fabric's namespace, so it reaches the
    # homelab network through the sidecar AND has a route onto the CI fabric.
    network_mode: "service:ci-fabric"

  # Tailscaled on the CI FABRIC (tail037f40.ts.net) -- a different tailnet from the
  # host-level daemon on powernet, which is untouched. The dispatcher shares this
  # namespace so it can dial a remote lane host's socket proxy.
  #
  # TS_USERSPACE=false, with NET_ADMIN and a tun device. This is NOT the lane host's
  # configuration and the difference is load-bearing: measured against the real
  # fabric on 2026-08-25, a container sharing a USERSPACE tailscaled's namespace
  # cannot open outbound connections to tailnet IPs at all -- curl times out, and
  # only tailscaled's own SOCKS5 proxy works, which docker-py cannot use for a
  # tcp:// endpoint. With a tun device a tailscale0 interface appears in the
  # namespace and the same request returns 200. A lane host only ACCEPTS
  # connections, which userspace handles fine, so it keeps userspace and no
  # NET_ADMIN -- the guarantee is strongest where the untrusted code runs.
  #
  # dns: 100.100.100.100 puts MagicDNS behind docker's embedded resolver rather
  # than in front of it. Verified both still work: docker service names resolve
  # (embedded DNS answers first) and tailnet FQDNs resolve (it forwards the rest).
  # Short tailnet names do not -- there is no search domain -- so lane-host
  # endpoints are written as FQDNs in personal/ci-controller.yml.
  #
  # The `ci-controller` network alias keeps http://ci-controller:8000/healthz
  # resolving for the dashboard: the dispatcher no longer has its own name on the
  # network, but the namespace it shares does.
  ci-fabric:
    image: tailscale/tailscale:v1.102.2
    container_name: ci-fabric
    restart: unless-stopped
    hostname: powerserver-dispatcher
    environment:
      TS_USERSPACE: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: "--advertise-tags=tag:ci-dispatcher-alvaro-francisco-gil"
    env_file:
      # Rendered by ansible from the sops store; never inlined here.
      - path: /opt/personal/secrets/ci-fabric.env
        required: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 100.100.100.100
    volumes:
      - ci-fabric-state:/var/lib/tailscale
    networks:
      homelab:
        aliases:
          - ci-controller

  ci-scheduler:
    image: homelab/ci-controller:latest
    build: .
    container_name: ci-scheduler
    restart: unless-stopped
    init: true
    command: ["python", "-m", "src.scheduler_main"]
    environment:
      CI_CONTROLLER_CONFIG: /etc/ci-controller/ci-controller.yml
    volumes:
      - /opt/personal/ci-controller.yml:/etc/ci-controller/ci-controller.yml:ro
      - /opt/personal/repos.yml:/etc/ci-controller/repos.yml:ro
    expose:
      - "8001"
    networks:
      - homelab

networks:
  homelab:
    external: true
    name: homelab

volumes:
  # Explicit `name:` so compose does NOT prefix it with the project directory
  # name. `make ci-fabric-join` writes the node identity into this volume by its
  # bare name before the stack exists, and compose would otherwise mount
  # `<project>_ci-fabric-state` instead -- leaving the sidecar unauthenticated and
  # printing an interactive login URL nobody reads. Hit exactly that on
  # 2026-08-25 while deploying powervaro-ci.
  ci-fabric-state:
    name: ci-fabric-state
