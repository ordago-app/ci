[project]
name = "homelab-ci-controller"
version = "0.1.0"
description = "Polls GitHub Actions queues and spawns capacity-admitted ephemeral self-hosted runners"
requires-python = ">=3.12"
dependencies = [
  "docker>=7.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  # Ansible's template engine. Used by the wiring tests to render a playbook's
  # conditional daemon.json block and assert what it actually produces, rather
  # than eyeballing the Jinja.
  "jinja2>=3.1",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
testpaths = ["tests"]
