name: gitleaks

# This repo commits a secrets SCHEMA and never a value (spec decision 7). That
# is a convention until something enforces it.
#
# NOT gitleaks/gitleaks-action: it requires a paid licence for repositories
# owned by an ORGANISATION, and refuses to scan without one. homelab runs the
# action because it belongs to a personal account. `ordago-app` is an org, so
# this runs the same scanner as its plain open-source binary instead. Pinned by
# version so a future release cannot silently change what counts as a leak.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --no-banner --redact --verbose .
