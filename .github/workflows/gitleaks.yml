name: gitleaks

# This repo commits a secrets SCHEMA and never a value (spec decision 7). That
# is a convention until something enforces it.
#
# NOT gitleaks/gitleaks-action: it requires a paid licence for repositories
# owned by an ORGANISATION and refuses to scan without one, which only shows up
# here because `ordago-app` is an org. This runs the plain open-source binary,
# pinned by version, exactly as homelab does — its config is in .gitleaks.toml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --redact --verbose --source .
